<!DOCTYPE html>
<html>
<head>
<title>Employee Management</title>
<style>
body{font-family:Arial; padding:20px; background:#f4f4f4}
.card{background:white; padding:20px; border-radius:10px; max-width:600px; margin:auto}
input{width:95%; padding:8px; margin:5px 0}
button{padding:10px 15px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer}
table{width:100%; margin-top:20px; border-collapse:collapse}
th,td{border:1px solid #ddd; padding:8px; text-align:left}
th{background:#007bff; color:white}
</style>
</head>
<body>
<div class="card">
<h2>Employee Management - Amulya</h2>
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="dept" placeholder="Department">
<input id="salary" placeholder="Salary" type="number">
<button onclick="addEmployee()">Add Employee</button>

<table id="empTable">
<tr><th>ID</th><th>Name</th><th>Dept</th><th>Email</th><th>Action</th></tr>
</table>
</div>

<script>
const API = "http://localhost:8080/employees";

function loadEmployees(){
 fetch(API).then(r=>r.json()).then(data=>{
   let table = document.getElementById("empTable");
   table.innerHTML = "<tr><th>ID</th><th>Name</th><th>Dept</th><th>Email</th><th>Action</th></tr>";
   data.forEach(e=>{
     table.innerHTML += `<tr><td>${e.id}</td><td>${e.name}</td><td>${e.department}</td><td>${e.email}</td><td><button onclick="deleteEmp(${e.id})">Delete</button></td></tr>`;
   });
 });
}

function addEmployee(){
 const emp = {
   name: document.getElementById("name").value,
   email: document.getElementById("email").value,
   department: document.getElementById("dept").value,
   salary: document.getElementById("salary").value
 };
 fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(emp)})
 .then(()=>{loadEmployees(); alert("Added!");});
}

function deleteEmp(id){
 fetch(API+"/"+id,{method:"DELETE"}).then(()=>loadEmployees());
}

loadEmployees();
</script>
</body>
</html>
